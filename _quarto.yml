project:
  type: website
  output-dir: _site
  resources:
    - assets/images/flights/flights-map.svg
    - assets/images/flights/flights-map-2014.svg
  render:
    - "*.qmd"
    - "*.ipynb"
    - "posts/**/*.qmd"
    - "posts/**/*.ipynb"
    - "projects/**/*.qmd"
    - "!strategy/"

execute:
  # Reuse frozen computational output; a post re-executes only when its own source
  # changes. Frozen results live in _freeze/ (committed). Keeps preview/CI from
  # re-running every notebook, and lets markdown-only previews skip Python.
  freeze: auto

website:
  title: "Jonathan Whitmore"
  description: "Personal website and blog"
  favicon: assets/images/favicon.ico
  site-url: https://jonathanwhitmore.com
  repo-url: https://github.com/jbwhit/website
  repo-actions: [issue]
  open-graph: true
  twitter-card:
    creator: "@jbwhitmore"
    card-style: summary_large_image
  page-navigation: true
  search: true

  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Blog
        href: blog.qmd
      - text: Projects
        menu:
          - text: The Last Moon
            href: https://jbwhit.github.io/habitable-zone-black-holes/
          - text: The Rediscovery of Neptune
            href: https://jbwhit.github.io/discoverneptune/
          - text: GPS in Reverse
            href: https://jbwhit.github.io/clocks/
          - text: UCSD Physics Qualifying Exams
            href: projects/physics-quals/index.qmd
          - text: Lithuanian Practice
            href: https://lithuanian-practice.com/
      - text: Courses
        href: https://jbwhitmore.gumroad.com/l/jupytermastery
      - text: About
        href: about.qmd
    tools:
      - icon: palette
        href: https://www.jbwhitmoreart.com/
      - icon: twitter-x
        href: https://x.com/jbwhitmore
      - icon: youtube
        href: https://www.youtube.com/@JonathanWhitmore
      - icon: linkedin
        href: https://www.linkedin.com/in/jonathanbwhitmore/
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/jbwhit/website
          - text: Report a Bug
            href: https://github.com/jbwhit/website/issues/new
      - icon: rss
        href: blog.xml

  page-footer:
    left: "&copy; 2010–present Jonathan Whitmore"

format:
  html:
    theme:
      light: [custom.scss]
      dark: [custom-dark.scss]
    highlight-style:
      light: gruvbox-light
      dark: gruvbox-dark
    css: styles.css
    toc: true
    # Tufte-style sidenotes: footnotes render in the right margin next to their
    # reference mark (collapsing to tap-to-expand on narrow screens)
    reference-location: margin
    # Figure/table captions in the margin, and a wider margin column so
    # sidenotes and captions read as text rather than a thin ribbon
    cap-location: margin
    grid:
      margin-width: 300px
    code-fold: true
    code-copy: true
    link-external-newwindow: true
    include-in-header: includes/fonts.html
